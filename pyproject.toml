[build-system]
requires = ["setuptools >= 61"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-mm-simulator"
version = "0.0.1"
description = "Event-driven market-making simulator (L2 book + tape replay, queue-position fills, multi-leg trade ledger). Sibling project to quant-research-framework; consumes its trade-log v1 schema verbatim."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Vieira Gatto", email = "77agdg@gmail.com" }]
keywords = ["market-making", "lob", "queue-position", "simulator", "quant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mmsim*"]
